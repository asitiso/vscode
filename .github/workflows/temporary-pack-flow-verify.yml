name: Temporary Pack Flow Verify

on:
  push:
    branches:
      - feature/add-equipment-cards-v2

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        run: npm install
      - id: focused
        run: |
          set +e
          npx vitest run src/game/workoutCompletionPack.test.ts src/screens/WorkoutCompletionFeedback.test.tsx > focused.log 2>&1
          code=$?
          summary=$(grep -E "AssertionError|TestingLibraryElementError|Unable to find|Found multiple|expected|Error:" focused.log | head -n 1)
          if [ -z "$summary" ]; then summary=$(tail -n 6 focused.log | tr '\n' ' '); fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary_b64=$(printf '%s' "$summary" | base64 -w0)" >> "$GITHUB_OUTPUT"
          exit 0
      - id: fulltests
        continue-on-error: true
        run: npm test
      - id: build
        continue-on-error: true
        run: npm run build
      - name: Publish verification statuses
        if: always()
        uses: actions/github-script@v7
        env:
          FOCUSED_CODE: ${{ steps.focused.outputs.code }}
          FOCUSED_SUMMARY_B64: ${{ steps.focused.outputs.summary_b64 }}
        with:
          script: |
            const focusedSummary = process.env.FOCUSED_SUMMARY_B64
              ? Buffer.from(process.env.FOCUSED_SUMMARY_B64, 'base64').toString('utf8').replace(/\s+/g, ' ').slice(0, 62)
              : 'no-output';
            const focusedState = process.env.FOCUSED_CODE === '0' ? 'success' : 'failure';
            const checks = [
              ['pack-flow-install', '${{ steps.install.outcome }}'],
              [`pack-flow-focused:${focusedSummary}`, focusedState],
              ['pack-flow-full-tests', '${{ steps.fulltests.outcome }}'],
              ['pack-flow-build', '${{ steps.build.outcome }}'],
            ];
            for (const [name, outcome] of checks) {
              const state = outcome === 'success' ? 'success' : 'failure';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: name,
                description: `${name}: ${outcome}`.slice(0, 140),
              });
            }
      - name: Fail when verification failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.focused.outputs.code }}" = "0"
          test "${{ steps.fulltests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
