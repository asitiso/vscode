name: Temporary Pack Flow Verify

on:
  push:
    branches:
      - feature/add-equipment-cards-v2

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: install
        continue-on-error: true
        run: npm ci
      - id: focused
        continue-on-error: true
        run: npx vitest run src/game/workoutCompletionPack.test.ts src/screens/WorkoutCompletionFeedback.test.tsx
      - id: fulltests
        continue-on-error: true
        run: npm test
      - id: build
        continue-on-error: true
        run: npm run build
      - name: Publish verification statuses
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const checks = [
              ['pack-flow-install', '${{ steps.install.outcome }}'],
              ['pack-flow-focused', '${{ steps.focused.outcome }}'],
              ['pack-flow-full-tests', '${{ steps.fulltests.outcome }}'],
              ['pack-flow-build', '${{ steps.build.outcome }}'],
            ];
            for (const [name, outcome] of checks) {
              const state = outcome === 'success' ? 'success' : 'failure';
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state,
                context: name,
                description: `${name}: ${outcome}`,
              });
            }
      - name: Fail when verification failed
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.focused.outcome }}" = "success"
          test "${{ steps.fulltests.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
