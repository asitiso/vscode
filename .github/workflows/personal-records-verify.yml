name: Personal Records Verify

on:
  pull_request:
    branches:
      - feature/add-equipment-cards-v2

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx vite build
      - run: npm run lint
