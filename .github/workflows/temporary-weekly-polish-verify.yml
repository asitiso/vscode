name: Temporary Weekly Polish Verify

# Task 4 timer/completion idempotency verification trigger.
on:
  push:
    branches:
      - feature/add-equipment-cards-v2

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: install
        continue-on-error: true
        run: npm install
      - id: tests
        if: steps.install.outcome == 'success'
        run: |
          set +e
          npm test > tests.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then
            summary=$(grep -E "Test Files|Tests " tests.log | tail -n 2 | tr '\n' ' ')
          else
            summary=$(grep -E "AssertionError|TestingLibraryElementError|Unable to find|Found multiple|expected|Error:|FAIL" tests.log | head -n 1)
          fi
          if [ -z "$summary" ]; then summary=$(tail -n 8 tests.log | tr '\n' ' '); fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary_b64=$(printf '%s' "$summary" | base64 -w0)" >> "$GITHUB_OUTPUT"
          exit 0
      - id: build
        if: steps.install.outcome == 'success'
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          if [ "$code" = "0" ]; then
            summary="build succeeded"
          else
            summary=$(grep -E "error TS|Error:|failed|FAIL" build.log | head -n 1)
          fi
          if [ -z "$summary" ]; then summary=$(tail -n 8 build.log | tr '\n' ' '); fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "summary_b64=$(printf '%s' "$summary" | base64 -w0)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish verification statuses
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_CODE: ${{ steps.tests.outputs.code }}
          TEST_SUMMARY_B64: ${{ steps.tests.outputs.summary_b64 }}
          BUILD_CODE: ${{ steps.build.outputs.code }}
          BUILD_SUMMARY_B64: ${{ steps.build.outputs.summary_b64 }}
        with:
          script: |
            const decode = (value) => value
              ? Buffer.from(value, 'base64').toString('utf8').replace(/\u001b\[[0-9;]*m/g, '').replace(/\s+/g, ' ').slice(0, 90)
              : 'not-run';
            const testsSummary = decode(process.env.TEST_SUMMARY_B64);
            const buildSummary = decode(process.env.BUILD_SUMMARY_B64);
            const checks = [
              ['weekly-polish-install', '${{ steps.install.outcome }}'],
              [`weekly-polish-tests:${testsSummary}`, process.env.TEST_CODE === '0' ? 'success' : 'failure'],
              [`weekly-polish-build:${buildSummary}`, process.env.BUILD_CODE === '0' ? 'success' : 'failure'],
            ];
            for (const [name, outcome] of checks) {
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                state: outcome === 'success' ? 'success' : 'failure',
                context: name,
                description: `${name}: ${outcome}`.slice(0, 140),
              });
            }
      - name: Fail on verification failure
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.tests.outputs.code }}" = "0"
          test "${{ steps.build.outputs.code }}" = "0"
